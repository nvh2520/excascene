name: release-audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for placeholders, local paths, credentials and misplaced files
        run: python tools/release_audit.py --mode github --root .
